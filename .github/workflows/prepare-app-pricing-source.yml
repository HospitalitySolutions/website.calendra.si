name: Prepare application-owned pricing

on:
  push:
    branches: [fix/app-owned-pricing-20261023]
    paths:
      - scripts/prepare-app-pricing-source.py
      - .github/workflows/prepare-app-pricing-source.yml

permissions:
  contents: write

concurrency:
  group: prepare-app-pricing-source
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'HospitalitySolutions/website.calendra.si' && github.ref == 'refs/heads/fix/app-owned-pricing-20261023'
    runs-on: [self-hosted, Linux]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/app-owned-pricing-20261023
      - name: Apply scoped source changes
        run: |
          python3 -m py_compile scripts/prepare-app-pricing-source.py
          python3 scripts/prepare-app-pricing-source.py
          git diff --check
          git diff --stat
      - name: Commit only intended source paths on the feature branch
        run: |
          git config user.name 'Calendra pricing maintenance'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/pricing-catalog.ts src/lib/public-pricing.ts plugins/pricing-snapshot.ts src/types/app-pricing-snapshot.d.ts src/test/fixtures/public-pricing-snapshot.ts src/hooks/use-public-pricing-catalog.ts vite.config.ts vitest.config.ts .gitignore scripts/prerender.mjs src/components/landing/Pricing.tsx src/pages/IndustryDetailPage.tsx src/lib/legal-documents.ts src/lib/legal-policy.ts src/components/legal/LegalPolicyPage.tsx src/lib/pricing-copy.ts index.html src/test/seo-completeness.test.ts src/test/public-pricing.test.tsx src/test/psychology-visibility.test.ts src/test/legal-policy.test.tsx docs/app-owned-website-pricing.md
          git commit -m 'fix: make website pricing derive exclusively from application catalog'
          git push origin HEAD:refs/heads/fix/app-owned-pricing-20261023
