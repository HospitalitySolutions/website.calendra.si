name: Prepare application-owned pricing
on:
  push:
    branches: [fix/app-owned-pricing-20261023]
    paths: [.github/workflows/prepare-app-pricing-source.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'HospitalitySolutions/website.calendra.si' && github.ref == 'refs/heads/fix/app-owned-pricing-20261023'
    runs-on: [self-hosted, Linux]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/app-owned-pricing-20261023
      - name: Remove stale explanatory rates
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/landing/Pricing.tsx')
          s = p.read_text()
          changes = {
              'Dodatni uporabniki: 5,90 € / mesec': 'Dodatni uporabniki po ceniku aplikacije',
              'Dodatna SMS sporočila: 0,06 € / sporočilo': 'SMS po porabi in ceniku aplikacije',
              'Additional users: €5.90 / month': 'Additional users at application-catalog rates',
              'Additional SMS messages: €0.06 / message': 'SMS usage at application-catalog rates',
          }
          for old, new in changes.items():
              assert s.count(old) == 1, old
              s = s.replace(old, new)
          p.write_text(s)
          p = Path('src/test/app-owned-pricing.test.tsx')
          s = p.read_text()
          needle = '    expect(read("vite.config.ts")).toContain("pricingSnapshotPlugin()");'
          assert s.count(needle) == 1
          s = s.replace(needle, '    expect(read("src/components/landing/Pricing.tsx")).not.toMatch(/5[.,]90|0[.,]06/);\n' + needle)
          p.write_text(s)
          PY
          git diff --check
          git config user.name 'Calendra pricing maintenance'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/landing/Pricing.tsx src/test/app-owned-pricing.test.tsx
          git commit -m 'fix: remove fixed rates from pricing explanatory copy'
          git push origin HEAD:refs/heads/fix/app-owned-pricing-20261023
